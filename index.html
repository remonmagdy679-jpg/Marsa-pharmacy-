<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E7C66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dr. Corner">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dr. Corner — المخزن والمبيعات</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#EEF4F3; --card:#FFFFFF; --ink:#102A2E; --muted:#587074; --line:#D3E0DE;
  --green:#0E7C66; --green-soft:#DDF0EA; --red:#C62A2F; --red-soft:#FBE6E6; --amber:#A8650A; --amber-soft:#FFF0D4;
  --label:#102A2E; --shadow:0 1px 0 rgba(16,42,46,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1617; --card:#132224; --ink:#E4EFEE; --muted:#90A8AA; --line:#24393B;
  --green:#3CC2A0; --green-soft:#16302B; --red:#F0575C; --red-soft:#3A1B1C; --amber:#F0B04A; --amber-soft:#3A2B12; --label:#E4EFEE; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0C1617; --card:#132224; --ink:#E4EFEE; --muted:#90A8AA; --line:#24393B;
  --green:#3CC2A0; --green-soft:#16302B; --red:#F0575C; --red-soft:#3A1B1C; --amber:#F0B04A; --amber-soft:#3A2B12; --label:#E4EFEE; --shadow:none;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alexandria","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:10px 16px 8px}
.brand h1{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0}
.brand h1 small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:400}
.brand h1 small i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.brand h1 small.off i{background:var(--red)}
.bell{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:19px}
.bell .pill{position:absolute;top:-6px;inset-inline-end:-6px}
.tabs{display:flex;gap:4px;max-width:760px;margin:0 auto;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 9px;font-size:14px;border-radius:10px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pill{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:4px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:20px;text-align:center}
.pill.amber{background:var(--amber)}
.searchbar{display:flex;flex-wrap:wrap;gap:6px;max-width:760px;margin:0 auto;padding:0 16px 10px}
.searchbar input{flex:1 1 150px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);flex:1 1 auto;min-height:40px}
.seg button{flex:1;border:0;background:transparent;padding:0 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}

.alertbar{display:block;width:100%;border:0;background:var(--red);color:#fff;font-weight:700;padding:8px 16px;text-align:center;font-size:14px}
.notice{margin:16px 0;padding:12px 14px;border-radius:12px;background:var(--red-soft);font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:12px 2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
h2.view{font-size:17px;margin:16px 2px 10px;font-weight:700}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1;flex:none}

.group{margin:16px 0 0}
.group h3{margin:0 2px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row.out{background:var(--red-soft)}
.row.low{background:var(--amber-soft)}
.row.slim{min-height:46px;padding:8px 10px}
.ti{flex:none;font-size:18px}
.kit{flex:1;min-width:0}
.kit b{display:block;font-weight:500;font-size:15px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.meta .ok{color:var(--green);font-weight:700}
.meta .rd{color:var(--red);font-weight:700}
.linkbtn{border:0;background:none;padding:0;text-align:start;font:inherit;color:inherit;width:100%}
.step{display:flex;align-items:center;gap:8px;flex:none}
.qty{min-width:34px;text-align:center;font-weight:800;font-size:20px;direction:ltr}
.qty.zero{color:var(--red)}
.qty.lowq{color:var(--amber)}
.sell{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.grow{flex:1;font-size:13px;color:var(--muted)}

/* batch label: date | qty — like a pharmacy shelf sticker */
.bts{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.bt{display:inline-flex;align-items:stretch;border:1.5px solid var(--label);border-radius:6px;overflow:hidden;font-size:12px;font-weight:700;direction:ltr;background:var(--card);padding:0;line-height:1.7}
.bt i{font-style:normal;background:var(--label);color:var(--card);padding:0 6px;font-weight:500}
.bt>span,.bt{padding-inline-end:0}
.bt::after{content:attr(data-n);padding:0 7px}
.bt.soon{border-color:var(--amber)} .bt.soon i{background:var(--amber)}
.bt.now,.bt.dead{border-color:var(--red)} .bt.now i,.bt.dead i{background:var(--red);color:#fff}
.bt.dead{text-decoration:line-through}
.bt.none{border-color:var(--red)} .bt.none i{background:var(--red);color:#fff}
button.bt{cursor:pointer}
button.bt.sel{outline:3px solid var(--green);outline-offset:1px}

.summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:14px 2px 4px}
.summary strong{font-size:32px;font-weight:800;color:var(--green)}
.summary span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.info{cursor:default;background:var(--bg)}
.dayhead{display:flex;align-items:center;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.dayhead input,.range input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.dayhead .dn{font-weight:700}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.range label{font-size:12px;color:var(--muted)}
.range input{width:100%}
.sale .money{font-weight:800;flex:none}
.log time,.sale time{font-size:12px;color:var(--muted);flex:none;min-width:52px}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;font-weight:700;flex:none;background:var(--line);color:var(--muted)}
.tag.sale,.tag.alert,.tag.out{background:var(--red-soft);color:var(--red)}
.tag.in,.tag.add{background:var(--green-soft);color:var(--green)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,22,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h4{margin:0 0 10px;font-size:17px}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.sheet label.check{display:flex;gap:8px;align-items:center;color:var(--ink)}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .actions .btn{flex:1}
.sheet input:not([type=checkbox]),.sheet select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.sheet textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;gap:6px}
.stepper input{text-align:center;font-weight:800}
.stepper.big .icon{width:52px;height:48px;font-size:22px}.stepper.big input{font-size:22px}
.ex{display:flex;gap:6px}
.ex select{flex:1}
.brow{display:flex;gap:6px;align-items:center;margin-top:6px}
.brow .ex{flex:2}
.brow .bq{flex:1;min-width:60px}
.tot{margin-top:12px;font-size:15px}
.tot b{font-size:22px;color:var(--green)}
.warn{background:var(--amber-soft);color:var(--ink);padding:8px 10px;border-radius:10px;font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.facts span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ---------- chat ---------- */
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:12;width:60px;height:60px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:27px;box-shadow:0 6px 18px rgba(14,124,102,.35)}
.fab .pill{position:absolute;top:-4px;right:-4px;border:2px solid var(--bg);line-height:18px}
.fab.wiggle{animation:wig .6s ease}
@keyframes wig{0%,100%{transform:none}20%{transform:rotate(-14deg) scale(1.08)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
.chat{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;background-color:var(--chatbg);
  background-image:radial-gradient(circle at 1px 1px,var(--chatdot) 1.3px,transparent 1.6px);background-size:22px 22px}
:root{--chatbg:#E3F1EC;--chatdot:#C6E0D7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chatbg:#0F1D1C;--chatdot:#1C302E}}
:root[data-theme="dark"]{--chatbg:#0F1D1C;--chatdot:#1C302E}
@media (min-width:700px){.chat{inset:auto;left:20px;bottom:20px;width:400px;height:min(660px,86vh);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(8,30,28,.28);border:1px solid var(--line)}}
.chead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--card);border-bottom:1px solid var(--line)}
@media (min-width:700px){.chead{padding-top:10px}}
.ctitle{flex:1;min-width:0;line-height:1.3}
.ctitle b{display:block;font-size:16px}
.ctitle small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle small.typing{color:var(--green);font-weight:700}
.cav{display:flex;flex-direction:row-reverse}
.cav .av{width:28px;height:28px;font-size:12px;border:2px solid var(--card);margin-inline-start:-8px;position:relative}
.cav .av::after{content:"";position:absolute;bottom:-1px;left:-1px;width:9px;height:9px;border-radius:50%;background:#2BC48A;border:2px solid var(--card)}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.cbody{flex:1;overflow-y:auto;padding:12px 12px 6px;overscroll-behavior:contain}
.cday{display:table;margin:12px auto 8px;background:var(--card);color:var(--muted);font-size:12px;padding:3px 12px;border-radius:12px;box-shadow:var(--shadow)}
.msg{display:flex;align-items:flex-end;gap:7px;margin-top:2px}
.msg.first{margin-top:10px}
.msg.me{justify-content:flex-end}
.msg .avs{width:32px;flex:none}
.bub{position:relative;max-width:78%;padding:7px 11px 5px;border-radius:18px;background:var(--card);box-shadow:0 1px 1.5px rgba(16,42,46,.12);border:0;text-align:start;font:inherit;color:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.first:not(.me) .bub{border-start-start-radius:5px}
.msg.me .bub{background:var(--green);color:#fff}
.msg.me.first .bub{border-start-end-radius:5px}
.bub .who{display:block;font-size:12px;font-weight:700;margin-bottom:1px}
.bub time{display:block;font-size:10px;opacity:.65;text-align:end;margin-top:1px;line-height:1.2}
.bub.big{background:none!important;box-shadow:none;font-size:40px;line-height:1.15;padding:0 2px;color:inherit!important}
.bub.big time{color:var(--muted);font-size:10px}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:-4px;position:relative;z-index:1}
.msg.me+.reacts,.reacts.me{justify-content:flex-end}
.reacts:not(.me){padding-inline-start:39px}
.reacts button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 7px;font-size:13px;line-height:22px}
.reacts button.mine{border-color:var(--green);background:var(--green-soft)}
.typingdots{display:inline-flex;gap:3px;margin:8px 0 2px;padding:9px 12px;background:var(--card);border-radius:16px}
.typingdots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:td 1.1s infinite}
.typingdots i:nth-child(2){animation-delay:.15s}.typingdots i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.cquick{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.cquick button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 11px;font-size:14px}
.cbar{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
@media (min-width:700px){.cbar{padding-bottom:10px}}
.cbar textarea{flex:1;resize:none;max-height:120px;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);font:inherit;line-height:1.45}
.csend{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:20px}
.csend span{display:inline-block;transform:scaleX(-1)}
.cempty{text-align:center;color:var(--muted);margin-top:30vh;font-size:14px}
.cempty b{display:block;font-size:42px}
.rpick{display:flex;justify-content:space-between;gap:6px;margin:4px 0 6px}
.rpick button{flex:1;font-size:26px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 0}
@media (prefers-reduced-motion: no-preference){.msg.new{animation:pop .28s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.8) translateY(8px);opacity:0}to{transform:none;opacity:1}}}

/* ---------- voice ---------- */
.micfab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:12;width:60px;height:60px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:26px;box-shadow:0 6px 18px rgba(16,42,46,.3)}
.vbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 10px}
.vmic{position:relative;width:96px;height:96px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:40px}
.vmic.on::before,.vmic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--green);animation:ring 1.6s ease-out infinite}
.vmic.on::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.vst{margin:0;color:var(--muted);font-size:14px;text-align:center}
.sheet textarea.vtx{min-height:70px;font-size:16px}
.vex{font-size:13px;color:var(--muted);margin-top:8px}
.vex summary{cursor:pointer;font-weight:700}
.vex ul{margin:6px 0 0;padding-inline-start:18px}
.heard{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--muted);margin:0 0 6px}
.vline{display:flex;gap:6px;align-items:center;margin-top:8px}
.vline select{flex:3}
.vline input{flex:1;min-width:56px;text-align:center;font-weight:800}
.icon.mic.on,.cmic.on{background:var(--red);color:#fff;border-color:var(--red)}
.cmic{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:19px}
.vrow{display:flex;gap:6px;align-items:flex-start}
.vrow textarea{flex:1}

/* ---------- notes ---------- */
.notesbtn{position:relative;display:flex;align-items:center;gap:6px;height:46px;padding:0 14px 0 12px;border:0;border-radius:14px;background:#FFE45C;color:#2A2A22;font-weight:800;font-size:15px;box-shadow:0 3px 0 #D9B900,0 6px 14px rgba(0,0,0,.18);transform:rotate(-2deg)}
.notesbtn .ni{font-size:22px;line-height:1}
.notesbtn .pill{position:absolute;top:-8px;inset-inline-end:-8px;min-width:24px;line-height:24px;font-size:13px;border:2px solid var(--bg)}
.notesbtn[aria-pressed="true"]{background:var(--ink);color:#FFE45C;box-shadow:none;transform:none}
.notesbtn.wiggle{animation:wig .6s ease}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:6px}
.sticky{position:relative;background:var(--nc);color:#2A2A22;padding:14px 12px 10px;border-radius:3px 3px 14px 3px;box-shadow:0 8px 14px -8px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.08);transform:rotate(-1deg);display:flex;flex-direction:column;min-height:130px}
.sticky:nth-child(even){transform:rotate(1.1deg)}
.sticky::before{content:"📌";position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:18px}
.sticky p{margin:4px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;flex:1}
.sticky .rem{align-self:flex-start;font-size:12px;font-weight:700;background:rgba(255,255,255,.6);border-radius:8px;padding:1px 8px;margin-bottom:6px}
.sticky .rem.due{background:#C62A2F;color:#fff}
.sticky footer{display:flex;align-items:center;gap:6px;font-size:11px;color:#5a5a4c}
.sticky footer span{flex:1}
.sticky footer button{border:0;background:rgba(255,255,255,.65);border-radius:8px;width:32px;height:30px;font-size:15px;color:#2A2A22}

  else{let i=0;const fixed={'01':14,'17':6,'11':6,'15':6};while(i<s.length){const ai=s.slice(i,i+2);if(fixed[ai]){out[ai]=s.slice(i+2,i+2+fixed[ai]);i+=2+fixed[ai]}else if(ai==='10'||ai==='21'){let e=s.indexOf(GS,i+2);if(e<0)e=s.length;out[ai]=s.slice(i+2,e);i=e+1}else break}}
  if(!out['01'])return null;const g={gtin:out['01']};
  if(out['17']&&/^\d{6}$/.test(out['17'])){g.y=2000+ +out['17'].slice(0,2);g.m=+out['17'].slice(2,4)||12}
  if(out['10'])g.batch=out['10'];return g}

function rrPath(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}

    sc=Math.min((bw-40)/im.width,(bh-40)/im.height);w=im.width*sc;h=im.height*sc;x.save();x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=24;x.drawImage(im,76+(bw-w)/2,PY+(bh-h)/2,w,h);x.restore()}

  if(alias){x.direction='rtl';x.fillStyle='#587074';x.font=`500 36px ${F}`;x.fillText(alias,W/2,NY+L.length*62+8)}

/* ---------- صورة تاريخ الصلاحية/الإنتاج → الإكسباير لوحده ---------- */
const DATE_PROMPT=`This is a close-up photo of the back or bottom of a pharmacy / cosmetics package showing printed codes and dates.
Return ONLY one JSON object, no markdown:
{"expiry":"MM/YYYY of the EXPIRY / EXP / Use before date, or null","production":"MM/YYYY of the production / manufacturing date (MFG, MFD, PD, PROD, or a code like P.07/26 meaning produced 07/2026), or null","shelf_life_months":number if printed (e.g. "Shelf life is 30 months from production date" or "صالح لمدة ٣٠ شهر"), else null,"batch":"batch / lot number or null","barcode":"digits printed under the barcode, or null"}
Dates printed as MM/YY mean month/20YY. Never guess: use null if not clearly printed.`;
function parseDatesText(t){t=toEn(String(t||'')).replace(/[Oo](?=\d)/g,'0').replace(/(\d)[Oo]/g,(m,x)=>x+'0');const out={};
  const ym=(m,y)=>{m=+m;y=+y;if(y<100)y+=2000;return m>=1&&m<=12&&y>=2015&&y<=2045?{m,y}:null};
  let r=/(?:EXP(?:IRY)?|EX|USE\s*BY|BB|BEST\s*BEFORE)\s*[.:]?\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/i.exec(t);if(r)out.exp=ym(r[1],r[2]);
  r=/(?:MFG|MFD|PROD|PD|MF|\bP)\s*[.:]?\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/i.exec(t);if(r)out.prod=ym(r[1],r[2]);
  r=/(\d{1,3})\s*months?/i.exec(t)||/صالح\s*لمد[ةه]\s*(\d{1,3})/.exec(t);if(r)out.life=+r[1];
  r=/\b(\d{13})\b/.exec(t.replace(/\s(?=\d)/g,''));if(r)out.code=r[1];
  return out}
function loadTess(){return window.Tesseract?Promise.resolve():loadScript(['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'])}
const dataToBlob=d=>fetch(d).then(r=>r.blob());
async function readDates(d,life,onStep){
  const res={};
  try{const bl=await dataToBlob(d);const raw=await decodeImageFile(bl);if(raw){const {code,g}=codeOf(raw);res.code=code;if(g&&g.y)res.k=bk(g.y,g.m),res.how='من الكود'}}catch(e){}
  if(!res.k&&getKey()){onStep&&onStep('🤖 بيقرا التاريخ…');try{const j=await askVision(d,DATE_PROMPT,400);
    const e=j.expiry&&parseExp(String(j.expiry));if(e&&e!=='x'){res.k=e;res.how='من تاريخ الإكسباير'}
    else if(j.production){const pp=bkParse(parseExp(String(j.production))||'');if(pp){res.prod=pp;res.life=+j.shelf_life_months||0}}
    if(!res.code&&j.barcode){const c=normCode(j.barcode);if(c&&c.length>=8)res.code=c}}catch(e){res.aiErr=e}}
  if(!res.k&&!res.prod){onStep&&onStep('🔍 بيقرا التاريخ من الصورة (أول مرة بتاخد شوية)…');try{await loadTess();const {data}=await Tesseract.recognize(d,'eng');const o=parseDatesText(data&&data.text);
    if(o.exp)res.k=bk(o.exp.y,o.exp.m),res.how='من تاريخ الإكسباير';else if(o.prod){res.prod=o.prod;res.life=o.life||0}if(!res.code&&o.code)res.code=normCode(o.code)}catch(e){res.ocrErr=1}}
  if(!res.k&&res.prod){const L=res.life||+life||+LS.get('drc.life')||0;if(L){const i=res.prod.y*12+res.prod.m-1+L;res.k=bk(Math.floor(i/12),i%12+1);res.how=`إنتاج ${pad(res.prod.m)}/${res.prod.y} + ${L} شهر`;res.life=L}}
  return res}
function applyExp(ex,res){if(!ex)return;
  if(res.k){const pp=bkParse(res.k);ex.querySelector('[data-x=m]').value=String(pp.m);const ys=ex.querySelector('[data-x=y]');if(![...ys.options].some(o=>o.value===String(pp.y)))ys.insertAdjacentHTML('beforeend',`<option>${pp.y}</option>`);ys.value=String(pp.y);ex.classList.add('aifill');if(res.life)ex.dataset.life=res.life;return}
  if(res.prod){const pn=ex.querySelector('.prod'),lk=ex.querySelector('[data-prod]');if(pn&&pn.hidden&&lk)lk.click();ex.querySelector('[data-x=pm]').value=String(res.prod.m);const py=ex.querySelector('[data-x=py]');if(![...py.options].some(o=>o.value===String(res.prod.y)))py.insertAdjacentHTML('beforeend',`<option>${res.prod.y}</option>`);py.value=String(res.prod.y);calcProd(ex)}}
function datePhoto(ex,codeInput,life,st){
  pickPhoto(true,async d=>{if(st)st.innerHTML='<span class="spin"></span>بيقرا الكود والتاريخ…';
    const res=await readDates(d,life,m=>{if(st)st.innerHTML='<span class="spin"></span>'+m});
    applyExp(ex,res);
    if(res.code&&codeInput){const l=codeInput.value.split(/[,،\s]+/).filter(Boolean);if(!l.includes(res.code)){l.push(res.code);codeInput.value=l.join(', ');codeInput.classList.add('aifill')}}
    const msg=res.k?`✓ الإكسباير ${bkLabel(res.k)} (${res.how})`:res.prod?`✓ تاريخ الإنتاج ${pad(res.prod.m)}/${res.prod.y} — اختار مدة الصلاحية`:'مقدرتش أقرا التاريخ — قرّب الكاميرا على التاريخ واتأكد إنه واضح';
    if(st)st.innerHTML=msg+(res.code?` — الباركود <span class="ltr">${esc(res.code)}</span>`:'');else toast(msg)},1600,.85);
}

function cellText(c){const h=c&&typeof c==='object'?String(c.h??c.t??''):String(c??'');const d=document.createElement('div');d.innerHTML=h.replace(/<br\s*\/?>/gi,' ');return d.textContent.replace(/\s+/g,' ').trim()}
async function reportPages(r){
  try{await document.fonts.ready}catch(e){}
  const W=1240,H=1754,M=64,F='Alexandria, Tahoma, Arial, sans-serif',pages=[];let cv,x,y=0;
  const fit=(t,w)=>{if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
  const head=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);pages.push(cv);
    x.direction='rtl';x.textBaseline='alphabetic';x.textAlign='right';x.fillStyle='#0E7C66';x.font=`800 40px ${F}`;x.fillText(SHOP_NAME,W-M,M+38);
    x.fillStyle='#1d2b2d';x.font=`700 30px ${F}`;x.fillText(r.title||'',W-M,M+82);
    x.textAlign='left';x.fillStyle='#5a6b6d';x.font=`500 22px ${F}`;x.fillText(`${dayName(today())} ${fmtDay(today())}`,M,M+38);
    y=M+100;if(pages.length===1&&r.sub){x.textAlign='right';x.font=`500 21px ${F}`;x.fillText(fit(r.sub,W-2*M),W-M,y+12);y+=30}
    x.fillStyle='#0E7C66';x.fillRect(M,y,W-2*M,5);y+=28};
  head();
  if(r.sum&&r.sum.length){const n=r.sum.length,g=14,bw=(W-2*M-(n-1)*g)/n,bh=104,CL={red:['#FDEDED','#C62A2F'],grn:['#E6F4EF','#0E7C66'],amb:['#FFF5E0','#A8650A']};
    r.sum.forEach(([l,v,c],i)=>{const bx=W-M-bw-i*(bw+g),[bg,fg]=CL[c]||['#F2F6F5','#1d2b2d'];x.fillStyle=bg;rrPath(x,bx,y,bw,bh,16);x.fill();x.direction='rtl';x.textAlign='right';x.fillStyle='#5a6b6d';x.font=`500 20px ${F}`;x.fillText(fit(String(l),bw-28),bx+bw-14,y+34);x.fillStyle=fg;x.font=`800 34px ${F}`;x.fillText(fit(String(v),bw-28),bx+bw-14,y+82)});y+=bh+26}
  const table=(hd,rows,foot,title)=>{
    const RH=46,avail=W-2*M;x.font=`500 20px ${F}`;
    const H2=hd.map(h=>typeof h==='object'?h.t:h),T=rows.map(r=>r.map(cellText)),Ft=foot?foot.map(cellText):null;
    let ws=H2.map((h,i)=>{let m=x.measureText(h).width;T.slice(0,300).forEach(r=>{m=Math.max(m,x.measureText(r[i]||'').width)});if(Ft)m=Math.max(m,x.measureText(Ft[i]||'').width);return Math.min(m+28,avail*.38)});
    const sc=avail/ws.reduce((a,b)=>a+b,0);ws=ws.map(w=>w*sc);
    const drawRow=(cells,bg,fg,bold)=>{if(bg){x.fillStyle=bg;x.fillRect(M,y,avail,RH)}let cx=W-M;cells.forEach((t,i)=>{x.fillStyle=fg;x.font=`${bold?700:500} 20px ${F}`;x.direction='rtl';x.textAlign='right';x.fillText(fit(String(t||''),ws[i]-16),cx-8,y+30);cx-=ws[i]});x.strokeStyle='#DCE6E4';x.lineWidth=1;x.beginPath();x.moveTo(M,y+RH);x.lineTo(W-M,y+RH);x.stroke();y+=RH};
    const hdr=()=>drawRow(H2,'#0E7C66','#fff',true);
    if(title){if(y+RH*3>H-M-40){head()}x.fillStyle='#E6F4EF';rrPath(x,M,y,avail,44,10);x.fill();x.fillStyle='#0E7C66';x.font=`800 22px ${F}`;x.direction='rtl';x.textAlign='right';x.fillText(fit(title,avail-24),W-M-12,y+30);y+=56}
    hdr();T.forEach((r,k)=>{if(y+RH>H-M-40){head();hdr()}drawRow(r,k%2?'#F6F9F8':null,'#1d2b2d',false)});
    if(Ft){if(y+RH>H-M-40){head();hdr()}drawRow(Ft,'#E6F4EF','#0E7C66',true)}y+=20};
  if(r.sections)r.sections.forEach(sec=>table(sec.head,sec.rows,sec.foot,sec.title+(sec.count!=null?` (${sec.count})`:'')));else if(r.head)table(r.head,r.rows||[],r.foot);
  pages.forEach((c,i)=>{const g=c.getContext('2d');g.fillStyle='#8a9a9c';g.font=`500 18px ${F}`;g.textAlign='center';g.direction='rtl';g.fillText(`${SHOP_NAME} — ${r.title||''} — صفحة ${i+1} من ${pages.length}`,W/2,H-36)});
  return pages}
async function makePdf(canvases){
  const enc=new TextEncoder(),parts=[],offs=[];let pos=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);pos+=u.length};
  const obj=(n,body)=>{offs[n]=pos;push(`${n} 0 obj\n`);body();push('\nendobj\n')};
  push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
  const N=canvases.length,PW=595.28,PH=841.89;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${canvases.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${N} >>`));
  for(let i=0;i<N;i++){const cv=canvases[i],jb=await new Promise(res=>cv.toBlob(res,'image/jpeg',.86)),jpg=new Uint8Array(await jb.arrayBuffer()),pid=3+i*3,content=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${pid+2} 0 R >> >> /Contents ${pid+1} 0 R >>`));
    obj(pid+1,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    obj(pid+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream')})}
  const total=3+N*3,xref=pos;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`+Array.from({length:total-1},(_,k)=>String(offs[k+1]).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}
async function sharePdf(r){

  try{const pages=await reportPages(r),blob=await makePdf(pages),name=`${SHOP_NAME} - ${r.title||'تقرير'} - ${today()}`.replace(/[\\/:*?"<>|]+/g,' ');
    await shareFiles([new File([blob],name+'.pdf',{type:'application/pdf'})],`${r.title||''}\n${r.sub||''}`)}
  catch(e){console.warn(e);toast('مقدرتش أعمل الـ PDF — هفتح الطباعة');doReport(r,'print')}}

const COUNT_PROMPT=(name,unit,hasRef,cols)=>`You are counting stock in a pharmacy / cosmetics shop.
${hasRef?`IMAGE 1 = reference photo of the registered product. IMAGE 2 = shelf/stock photo to count.`:''}
Product name (may be imprecise — e.g. size or wording may be wrong): "${name||'unknown'}".
${cols&&cols.length?`Main colours of the reference package (measured from its coloured pixels, background ignored): ${cols.join(', ')}. Units on the shelf may show a different face/side of the same box (e.g. the narrow end with a coloured band) — match by these colours.`:''}
HOW TO MATCH: identify the product by its PACKAGE COLOURS and DESIGN as seen in ${hasRef?'IMAGE 1':'the name'} — same dominant colour(s), same logo/brand, same colour layout. A unit counts as the SAME product when its package colours and design match the reference, even if: it is seen from another side or angle, the visible face is in Arabic instead of English, the size/weight text is unreadable, or the name above is wrong. Exclude a unit ONLY if its package colour is clearly different from the reference (e.g. a blue or green pack when the reference is gold/red).
A unit = one ${unit==='box'?'medicine box / pack (not tablets or strips)':'retail item (one box, bottle, tube, jar or pack)'}. Count units partly hidden in rows/stacks if you can see them; never guess units you cannot see.
Return ONLY one JSON object, no markdown:
{"count":integer (units matching the reference colours),"match_colour":"short Arabic description of the colour you matched, e.g. ذهبي وأحمر","others":[{"name":"short Arabic description by colour, e.g. علب زرقاء","count":integer}],"confidence":"high"|"medium"|"low","note":"very short Arabic note"}`;
async function refColours(d){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const W=60,H=60,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.drawImage(im,0,0,W,H);const px=x.getImageData(0,0,W,H).data,bins={};
  for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b=px[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/510,sat=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255));
    let nm;if(l>.9||l<.12||sat<.25)continue;else{let h=0;const dd=mx-mn;h=mx===r?((g-b)/dd)%6:mx===g?(b-r)/dd+2:(r-g)/dd+4;h=(h*60+360)%360;
      nm=h<15||h>=345?'red':h<40?(l<.4?'brown':'orange'):h<65?(sat<.55||l<.45?'gold':'yellow'):h<160?'green':h<200?'turquoise':h<255?'blue':h<290?'purple':'pink'}
    bins[nm]=(bins[nm]||0)+1}
  const tot=Object.values(bins).reduce((a,b)=>a+b,0);if(tot<W*H*.04)return res([]);const top=Object.entries(bins).sort((a,b)=>b[1]-a[1]).filter(([,n])=>n/tot>.1).slice(0,3).map(([k,n])=>`${k} ${Math.round(n/tot*100)}%`);res(top)}catch(e){res([])}};im.onerror=()=>res([]);im.src=d})}

const $calc=$('calc');let cExp='',cLastInput=null,cJust=false;
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&(t.type==='number'||/decimal|numeric/.test(t.inputMode||''))&&!$calc.contains(t))cLastInput=t});
function calcEval(src){src=toEn(String(src)).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'');
  const tk=src.match(/\d*\.?\d+|[-+*/%()]/g)||[];let i=0;
  const peek=()=>tk[i],eat=()=>tk[i++];
  const prim=()=>{let t=eat();if(t==='-')return -prim();if(t==='+')return prim();if(t==='('){const v=expr();if(peek()===')')eat();return post(v)}if(t==null||isNaN(+t))throw 0;return post(+t)};
  const post=v=>{while(peek()==='%'){eat();v=v/100}return v};
  const term=()=>{let v=prim();while(peek()==='*'||peek()==='/'){const o=eat(),r=prim();v=o==='*'?v*r:v/r}return v};
  const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=eat();let r=term();
    // 100+10% = 110 زي الآلة العادية
    if(tk[i-1]==='%'&&/[\d)]/.test(tk[i-2]||''))r=v*r;v=o==='+'?v+r:v-r}return v};
  const v=expr();if(i<tk.length||!isFinite(v))throw 0;return Math.round(v*1e8)/1e8}
const cFmt=v=>Number(v).toLocaleString('en-US',{maximumFractionDigits:8});
function calcDraw(){const show=cExp.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');$('cExp').textContent=show||'';
  let r='';try{r=cExp?cFmt(calcEval(cExp)):'0'}catch(e){r=$('cRes').textContent}$('cRes').textContent=r;$('cRes').classList.toggle('fin',cJust)}
function calcHist(){let h=[];try{h=JSON.parse(LS.get('drc.calcH')||'[]')}catch(e){}return h}
function calcOpen(){$calc.hidden=false;$('cUse').hidden=!(cLastInput&&document.body.contains(cLastInput));calcDraw();try{history.pushState({calc:1},'')}catch(e){}}
function calcClose(){$calc.hidden=true;$('cHist').hidden=true}
function calcKey(k){
  if(k==='close')return calcClose();
  if(k==='hist'){const h=calcHist(),el=$('cHist');el.hidden=!el.hidden;el.innerHTML=h.length?h.map((x,i)=>`<button data-c="h:${i}"><span>${esc(x.e)}</span><b>= ${esc(x.r)}</b></button>`).join('')+'<button data-c="hclr" class="mu">امسح السجل</button>':'<p class="mu">لسه مفيش عمليات</p>';return}
  if(k==='hclr'){LS.set('drc.calcH','[]');$('cHist').hidden=true;return}
  if(k.startsWith('h:')){const x=calcHist()[+k.slice(2)];if(x){cExp=String(x.v);cJust=false;$('cHist').hidden=true;calcDraw()}return}
  if(k==='copy'){copyText($('cRes').textContent.replace(/,/g,'')).then(ok=>toast(ok?'الناتج اتنسخ':'انسخه يدوي'));return}
  if(k==='use'){if(cLastInput&&document.body.contains(cLastInput)){let v;try{v=calcEval(cExp||'0')}catch(e){return}cLastInput.value=v;cLastInput.dispatchEvent(new Event('input',{bubbles:true}));cLastInput.dispatchEvent(new Event('change',{bubbles:true}));calcClose();toast('الرقم اتحط في الخانة')}return}
  if(k==='C'){cExp='';cJust=false;return calcDraw()}
  if(k==='back'){cExp=cJust?'':cExp.slice(0,-1);cJust=false;return calcDraw()}
  if(k==='='){if(!cExp)return;try{const v=calcEval(cExp),h=calcHist();h.unshift({e:cExp.replace(/\*/g,'×').replace(/\//g,'÷'),r:cFmt(v),v});LS.set('drc.calcH',JSON.stringify(h.slice(0,15)));cExp=String(v);cJust=true;calcDraw()}catch(e){toast('العملية مش مكتملة')}return}
  if(k==='('){const o=(cExp.match(/\(/g)||[]).length,c=(cExp.match(/\)/g)||[]).length;k=o>c&&/[\d)%]$/.test(cExp)?')':(/[\d)%]$/.test(cExp)?'*(':'(')}
  if(/^[-+*/%]$/.test(k)){cJust=false;if(!cExp&&k!=='-')cExp='0';if(/[-+*/]$/.test(cExp)&&k!=='%')cExp=cExp.slice(0,-1);cExp+=k;return calcDraw()}
  if(cJust&&/[\d.]/.test(k)){cExp='';}cJust=false;
  if(k==='.'){const last=(cExp.match(/[\d.]*$/)||[''])[0];if(last.includes('.'))return;if(!last)k='0.'}
  cExp+=k;calcDraw()}
$calc.addEventListener('click',e=>{if(e.target===$calc)return calcClose();const b=e.target.closest('[data-c]');if(b){e.stopPropagation();calcKey(b.dataset.c)}});
$('calcBtn').addEventListener('click',calcOpen);
document.addEventListener('click',e=>{if(e.target.closest('[data-calc]')){e.preventDefault();e.stopPropagation();calcOpen()}},true);
document.addEventListener('keydown',e=>{if($calc.hidden)return;const m={Enter:'=',Backspace:'back',Escape:'close',Delete:'C'}[e.key]||(/^[0-9.+\-*/%()]$/.test(e.key)?e.key:null);if(m){e.preventDefault();calcKey(m==='('||m===')'?'(':m)}});

function wilson(k,n,z=1.96){if(!n)return 0;const p=k/n,z2=z*z;return (p+z2/(2*n)-z*Math.sqrt(p*(1-p)/n+z2/(4*n*n)))/(1+z2/n)}
function startFb(){col('feedback').where('t','>=',winStart).onSnapshot(q=>{S.fb=q.docs.map(d=>({fid:d.id,...d.data()}))},()=>{S.fb=[]})}
function heroStats(days=30){
  const from=Date.now()-days*864e5,sales=S.sales.filter(x=>x.t>=from&&!x.del),fb=(S.fb||[]).filter(x=>x.t>=from);
  const invs=new Set(sales.map(x=>x.inv||('s'+x.sid))),N=invs.size,M={};
  const g=id=>M[id]=M[id]||{inv:new Set(),wins:0,loss:0,obj:{},why:{},nat:{}};
  sales.forEach(x=>{const o=g(x.id);o.inv.add(x.inv||('s'+x.sid));o.wins++;if(x.why)o.why[x.why]=(o.why[x.why]||0)+1;if(x.nat)o.nat[x.nat]=(o.nat[x.nat]||0)+1});
  fb.forEach(f=>{const o=g(f.id);if(f.kind==='no'){o.loss++;if(f.reason)o.obj[f.reason]=(o.obj[f.reason]||0)+1}if(f.nat)o.nat[f.nat]=(o.nat[f.nat]||0)+1});
  return Object.entries(M).map(([id,o])=>{const p=S.items.find(x=>x.id===id);if(!p)return null;const k=o.inv.size,off=o.wins+o.loss;
    return {p,k,N,pop:wilson(k,N),off,conv:off>=3?wilson(o.wins,off):null,obj:o.obj,why:o.why,nat:o.nat,loss:o.loss}}).filter(Boolean).sort((a,b)=>b.pop-a.pop)}

function showCard(p,P,lang){if(!P||!P.card)return;let el=$('showc');if(!el){el=document.createElement('div');el.id='showc';el.className='showc';document.body.appendChild(el);el.addEventListener('click',e=>{const b=e.target.closest('[data-sc]');if(!b)return;if(b.dataset.sc==='x')el.hidden=true;if(b.dataset.sc==='img')cardImage(el._p,el._P).then(f=>shareFiles([f],''))})}
  el._p=p;el._P=P;const px=lastPx(p,'EUR');
  el.innerHTML=`<div class="scard"><button class="scx" data-sc="x" aria-label="قفل">✕</button>${P.card.badge?`<span class="sbadge">${esc(P.card.badge)}</span>`:''}${p.img?`<img src="${p.img}" alt="">`:''}<h2 dir="auto">${esc(P.card.headline||'')}</h2><p dir="auto">${esc(P.card.line||'')}</p><div class="sname">${esc(p.name)}</div>${px?`<div class="sprice">€${num(px)}</div>`:''}<button class="btn sm" data-sc="img">🖼️ صورة للطباعة / الواتساب</button></div>`;el.hidden=false;
  fullImg(p.id).then(d=>{if(d&&!el.hidden){const im=el.querySelector('img');if(im)im.src=d}});try{history.pushState({sc:1},'')}catch(e){}}
async function cardImage(p,P){try{await document.fonts.ready}catch(e){}const F='Alexandria, Tahoma, Arial, sans-serif',W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#F4FAF8';x.fillRect(0,0,W,H);x.fillStyle='#0E7C66';x.fillRect(0,0,W,16);
  const src=p.img?(await fullImg(p.id))||p.img:'';const im=src?await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src}):null;
  if(im){const bw=W-160,bh=620,sc=Math.min(bw/im.width,bh/im.height),w=im.width*sc,h=im.height*sc;x.save();x.shadowColor='rgba(0,0,0,.15)';x.shadowBlur=30;x.drawImage(im,(W-w)/2,90+(bh-h)/2,w,h);x.restore()}
  const wrap=(t,font,max,y,lh,col)=>{x.font=font;x.fillStyle=col;x.textAlign='center';x.direction=/[؀-ۿ]/.test(t)?'rtl':'ltr';const ws=String(t).split(' '),L=[];let ln='';ws.forEach(w=>{const tt=ln?ln+' '+w:w;if(x.measureText(tt).width>max&&ln){L.push(ln);ln=w}else ln=tt});L.push(ln);L.slice(0,3).forEach((l,i)=>x.fillText(l,W/2,y+i*lh));return y+Math.min(3,L.length)*lh};
  let y=wrap(P.card.headline||'',`800 76px ${F}`,W-140,800,88,'#102A2E');y=wrap(P.card.line||'',`500 44px ${F}`,W-160,y+30,58,'#3d5457');
  x.font=`700 38px ${F}`;x.fillStyle='#0E7C66';x.textAlign='center';x.direction='ltr';x.fillText(p.name,W/2,Math.min(y+70,H-150));
  const px=lastPx(p,'EUR');if(px){x.font=`800 64px ${F}`;x.fillText('€'+num(px),W/2,H-80)}
  if(P.card.badge){x.font=`800 34px ${F}`;const bw=x.measureText(P.card.badge).width+50;x.fillStyle='#0E7C66';rrPath(x,W-60-bw,40,bw,62,31);x.fill();x.fillStyle='#fff';x.fillText(P.card.badge,W-60-bw/2,82)}
  const b=await new Promise(res=>c.toBlob(res,'image/jpeg',.9));return new File([b],fileName(p.name)+' card.jpg',{type:'image/jpeg'})}

  else if(act==='sh-gsend')shSend(b.dataset.g);
  else if(act==='sh-gtog'){const l=shortList().filter(p=>grpOf(p)===b.dataset.g),allOn=l.every(shSel);l.forEach(x=>shSet(x.id,{on:!allOn}));render()}
  else if(act==='sh-text'){const sel=shSelected();if(!sel.length)return toast('علّم على صنف واحد على الأقل');textSheet('نواقص',shText(sel))}
  else if(act==='inv-total')invTotalSheet(b.dataset.inv);
  else if(act==='urgent'&&p)urgent(p);
  else if(act==='alert-out')alertAllOut();
  else if(act==='out'&&p)outSheet(p,k);
  else if(act==='smode'){S.shortMode=k;render()}
  else if(act==='clearq'){S.q='';$q.value='';render()}
  else if(act==='inv-open'){if(CART.lines.length)invSheet();else pickItemSheet()}
  else if(act==='smode2'){S.salesMode=k;LS.set('drc.smode',k);render()}
  else if(act==='epre'){S.expPreset=k;render()}
  else if(act==='day-prev'||act==='day-next'){const d=new Date(S.day+'T12:00:00');d.setDate(d.getDate()+(act==='day-prev'?-1:1));const nk=dayKey(d);S.day=nk>today()?today():nk;render()}
  else if(act==='undo-inv')undoInv(b.dataset.inv);
  else if(act==='undo-sale'){const s=(salesOf(S.day)||[]).find(x=>x.sid===b.dataset.sid);if(s)undoSale(s)}
  else if(act==='rep-short')doReport(repShort(),k);
  else if(act==='rep-sales')doReport(repSales(),k);
  else if(act==='rep-exp')doReport(repExp(),k);
  else if(act==='account')accountSheet();
  else if(act==='users')usersSheet();
  else if(act==='settings')settingsSheet();
  else if(act==='perm')askPerm();
  else if(act==='app')appSheet();
  else if(act==='acc-open'){S.acc=b.dataset.cid;LS.set('drc.acc',S.acc);S.q='';$q.value='';render();scrollTo(0,0)}
  else if(act==='acc-back'){S.acc='';LS.set('drc.acc','');S.q='';$q.value='';render()}
  else if(act==='acc-newc')companySheet(null);
  else if(act==='acc-menu'){const c=S.companies.find(x=>x.id===S.acc);if(c)accMenu(c)}
  else if(act==='acc-range'){S.accRange=k;render()}
  else if(act==='acc-add')entrySheet(S.acc,k);
  else if(act==='acc-edit'){const e=S.ledger.find(x=>x.id===b.dataset.eid);if(e)entrySheet(e.cid,e.kind,{},e)}
  else if(act==='acc-img'){const e=S.ledger.find(x=>x.id===b.dataset.eid);if(e)openZoomSrc('',`${KIND[e.kind].l} ${e.no||''} — ${num(e.amount)}`,'L_'+e.id)}
  else if(act==='acc-addimg'){const e=S.ledger.find(x=>x.id===b.dataset.eid);if(e)attachLedgerImg(e)}
  else if(act==='acc-cam')pickImage(true);
  else if(act==='acc-scanmenu')accScanMenu();
  else if(act==='acc-manual')accManual();
  else if(act==='acc-send')accSend();
  else if(act==='acc-gal')pickImage(false);
  else if(act==='acc-key')keySheet();
  else if(act==='acc-import')importSheet();
  else if(act==='rep-acc')doReport(repAcc(),k);
  else if(act==='export')exportData();
  else if(act==='import')importData();
  else if(act==='backups')backupsSheet();
  else if(act==='trash')trashSheet();
  else if(act==='note-new')noteSheet();
  else if(act==='note-edit'){const n=S.notes.find(x=>x.id===b.dataset.nid);if(n)noteSheet({},n)}
  else if(act==='note-voice')voiceSheet('note');
  else if(act==='note-done')run(ref('notes/'+b.dataset.nid).update({done:true,doneBy:me(),doneT:Date.now()}),'اتعلّمت خلصت عند الكل');
  else if(act==='note-undo')run(ref('notes/'+b.dataset.nid).update({done:false}),'رجعت للنوتس المفتوحة');
  else if(act==='note-del')openSheet('<h4>تمسح النوت دي من عند الكل؟</h4><div class="actions"><button class="btn" data-cancel>لأ</button><button class="btn danger" data-m="ok">امسح</button></div>',()=>{closeSheet();run(ref('notes/'+b.dataset.nid).delete(),'اتمسحت')});
});

/* ---------- start ---------- */
(function start(){
  if(typeof firebase==='undefined'){S.error='مش قادر أحمّل Firebase — اتأكد إن النت شغال وافتح الصفحة تاني.';render();return}
  try{firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});auth=firebase.auth()}catch(e){S.error='بيانات Firebase غلط.';render();return}
  render();
  auth.onAuthStateChanged(u=>{if(settingUp)return;if(u)afterAuth(u);else showLogin()});
})();
function startData(){
  let lastErr='';
  const fail=e=>{console.error(e);lastErr=(e&&(e.code||e.message))||'';if(e&&e.code==='permission-denied'){S.error='Firebase رافض القراية — الحساب ده ملوش صلاحية، أو القواعد (Rules) محتاجة تتراجع. <div class="toolbar" style="margin-top:12px"><button class="btn" onclick="firebase.auth().signOut().then(()=>location.reload())">خروج</button></div>';render()}};
  col('items').onSnapshot({includeMetadataChanges:true},snap=>{
    S.offline=snap.metadata.fromCache;const all=snap.docs.map(d=>({id:d.id,...d.data()}));S.items=all.filter(x=>!x.del);S.trash.items=all.filter(x=>x.del);S.loaded.items=1;
    if(!S.ready){S.ready=true;S.error=''}render();
  },fail);
  col('sales').where('t','>=',winStart).orderBy('t','desc').onSnapshot(snap=>{S.sales=snap.docs.map(d=>({sid:d.id,...d.data()})).filter(x=>!x.del);if(S.ready)render()},fail);
  col('alerts').orderBy('t','desc').limit(80).onSnapshot(snap=>{
    S.alerts=snap.docs.map(d=>({aid:d.id,...d.data()}));
    const fresh=S.alerts.filter(a=>!a.done&&a.t>seen&&!isMine(a));
    const mx=Math.max(seen,...S.alerts.map(a=>a.t||0));seen=mx;LS.set('drc.seen',mx);
    if(fresh.length&&!snap.metadata.hasPendingWrites)notify(fresh);
    if(S.ready)render();
  },e=>console.error(e));
  col('events').orderBy('t','desc').limit(400).onSnapshot(snap=>{S.events=snap.docs.map(d=>d.data());if(S.view==='log')render()},e=>console.error(e));
  startChat();startNotes();startAcc();
  col('invoices').where('t','>=',winStart).onSnapshot(snap=>{S.invs={};snap.docs.forEach(d=>S.invs[d.id]=d.data());if(S.view==='sales')render()},()=>{});
  startFb();
  col('members').onSnapshot(q=>{S.members=q.docs.map(d=>({uid:d.id,...d.data()}));S.membersErr=false},()=>{S.membersErr=true});
  ref('secrets/ai').onSnapshot(d=>{S.teamKey=(d.data()||{}).key||''},()=>{});
  ref('settings/app').onSnapshot({includeMetadataChanges:true},d=>{S.cfg={cur:'ج.م',...(d.data()||{})};if(!d.metadata.fromCache&&!S.cfg.topic)ensureTopic();if(S.ready)render()},e=>console.error(e));
  setTimeout(()=>{if(S.ready||S.error)return;
    S.error=`الموقع مش قادر يوصل للبيانات.<br><br>1) اقفل أي تاب تاني مفتوح فيه الموقع.<br>2) اتأكد إن النت شغال.${lastErr?`<br><br><small style="direction:ltr;display:block">${esc(lastErr)}</small>`:''}<div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div>`;render();
  },12000);
  addEventListener('online',()=>{S.offline=false;renderTop()});addEventListener('offline',()=>{S.offline=true;renderTop()});
}
})();
</script>
